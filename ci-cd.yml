# ─────────────────────────────────────────────────────────────────────────────
# Pipeline de CI/CD — ia-recruitment
#
#   PR / push ──► [CI]  lint-backend ─┐
#                       test-backend ─┤
#                       frontend ─────┼──► build-images ──► deploy-staging ──► deploy-production
#                       codeql ───────┘    (GHCR + Grype)   (efêmero + ZAP)    (aprovação manual)
#                       dependency-review (só em PR)
#
# Ambientes do GitHub (Settings ▸ Environments):
#   staging     → sobe a stack completa no runner, roda testes dinâmicos (MCP + ZAP)
#   production  → deploy via SSH no servidor; configure "Required reviewers"
#                 para que a promoção exija aprovação manual.
#
# Verificação estática : Ruff, Alembic check, ESLint/Prettier/tsc, CodeQL,
#                        Dependency Review, Grype (imagens de container).
# Verificação dinâmica : pytest com PostgreSQL real, testes de protocolo MCP,
#                        smoke tests HTTP e OWASP ZAP baseline no staging.
#
# Actions de terceiros estão fixadas por SHA de commit (defesa contra tag
# hijacking, como no incidente do trivy-action em mar/2026).
# ─────────────────────────────────────────────────────────────────────────────
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Princípio do menor privilégio: cada job pede só o que precisa.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  REGISTRY: ghcr.io
  # Nomes de imagem no GHCR precisam ser minúsculos.
  IMAGE_API: ghcr.io/${{ github.repository }}-api
  IMAGE_UI: ghcr.io/${{ github.repository }}-ui
  COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml
  APP_SERVICES: >-
    postgres mcp-job-opening mcp-process-management mcp-candidate-screening
    mcp-scheduling mcp-orchestrator agentos caddy

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # CI — verificação estática
  # ═══════════════════════════════════════════════════════════════════════════
  lint-backend:
    name: Lint & format (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --extra dev --frozen

      - name: uv.lock sincronizado com pyproject.toml
        run: uv lock --check

      - name: Ruff (lint)
        run: uv run ruff check . --output-format=github

      - name: Ruff (format)
        run: uv run ruff format --check --diff .

  frontend:
    name: Lint, typecheck & build (agent-ui)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-ui
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: agent-ui/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: ESLint + Prettier + TypeScript
        run: pnpm validate

      - name: Build de produção
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  # ═══════════════════════════════════════════════════════════════════════════
  # CI — verificação dinâmica (testes com banco real e servidores MCP no ar)
  # ═══════════════════════════════════════════════════════════════════════════
  test-backend:
    name: Testes (unitários + integração MCP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recruitment
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123 # credencial descartável, só existe neste job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d recruitment"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://admin:admin123@localhost:5432/recruitment
      ANTHROPIC_API_KEY: sk-ant-ci-dummy # testes não chamam o LLM
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Instalar dependências
        run: |
          uv sync --extra dev --frozen
          cp .env.example .env

      - name: Migrações — upgrade, downgrade e upgrade (reversibilidade)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Migrações — modelos e migrations sem divergência
        run: uv run alembic check

      - name: Testes unitários + cobertura
        run: >
          uv run pytest -v
          --cov=services --cov=tools --cov=db --cov=schemas
          --cov-report=xml --cov-report=term
          --junitxml=reports/junit-unit.xml

      - name: Subir servidores MCP e AgentOS
        run: |
          mkdir -p reports
          ./start.sh > reports/servers.log 2>&1 &
          for port in 8000 8001 8002 8003 8004 7777; do
            timeout 60 bash -c "until nc -z localhost $port; do sleep 1; done" \
              || { echo "::error::porta $port não subiu"; cat reports/servers.log; exit 1; }
          done

      - name: Testes de protocolo MCP (initialize, tools/list, tools/call)
        run: uv run pytest -m integration -v --junitxml=reports/junit-integration.xml

      - name: Resumo de cobertura
        if: always()
        run: |
          echo "### Cobertura de testes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=text >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            reports/
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # Build — imagens Docker, scan de vulnerabilidades e publicação no GHCR
  # ═══════════════════════════════════════════════════════════════════════════
  build-images:
    name: Build & scan (${{ matrix.name }})
    needs: [lint-backend, frontend, codeql, test-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
          - name: ui
            context: agent-ui
    env:
      IMAGE: ${{ matrix.name == 'api' && format('ghcr.io/{0}-api', github.repository) || format('ghcr.io/{0}-ui', github.repository) }}
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem (tags e labels OCI)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build (local, para o scan)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan de vulnerabilidades (Grype)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:scan
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: sarif

      - name: Publicar resultados no Code Scanning
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: container-${{ matrix.name }}

      - name: Push para o GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

  # ═══════════════════════════════════════════════════════════════════════════
  # CD — Ambiente 1: STAGING
  # Sobe a stack de produção (mesmas imagens, mesmo compose) de forma efêmera
  # no runner e executa a verificação dinâmica antes de promover.
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy & testes dinâmicos (staging)
    needs: build-images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar .env do staging
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cp .env.example .env
          sed -i 's/^DEBUG=.*/DEBUG=false/' .env
          sed -i "s|^ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-ant-staging-dummy}|" .env
          {
            echo "IMAGE_API=${IMAGE_API}:${GITHUB_SHA}"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
          } >> .env

      - name: Baixar imagens
        run: $COMPOSE pull $APP_SERVICES

      - name: Migrações do banco
        run: $COMPOSE run --rm migrate

      - name: Subir aplicação
        run: $COMPOSE up -d --no-build $APP_SERVICES

      - name: Aguardar health check (via Caddy)
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost/health && exit 0
            sleep 2
          done
          echo "::error::AgentOS não respondeu em /health"
          $COMPOSE ps
          $COMPOSE logs --tail=100
          exit 1

      - name: Popular dados de teste
        run: $COMPOSE run --rm migrate uv run python scripts/seed.py

      - name: Smoke test — API de processos
        run: |
          curl -fsS http://localhost/api/processes | tee processes.json | jq -e '.total >= 1'
          curl -s -o /dev/null -w '%{http_code}' http://localhost/api/processes/PROC-NAO-EXISTE | grep -q 404

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Testes de protocolo MCP através do gateway
        env:
          MCP_BASE_URL: http://localhost
        run: |
          uv sync --extra dev --frozen
          uv run pytest -m integration -v --junitxml=reports/junit-staging.xml

      - name: DAST — OWASP ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost
          cmd_options: -a
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-staging-report

      - name: Coletar logs
        if: always()
        run: |
          mkdir -p reports
          $COMPOSE logs --no-color > reports/staging-compose.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: staging-reports
          path: reports/
          retention-days: 14

      - name: Derrubar ambiente efêmero
        if: always()
        run: $COMPOSE down -v --remove-orphans

  # ═══════════════════════════════════════════════════════════════════════════
  # CD — Ambiente 2: PRODUCTION
  # Promove a MESMA imagem validada no staging. Com "Required reviewers"
  # configurado no environment, o job aguarda aprovação manual.
  #
  # Secrets do environment `production`:
  #   PROD_SSH_HOST, PROD_SSH_USER, PROD_SSH_KEY  → acesso ao servidor
  #   PROD_ENV_FILE → conteúdo completo do .env de produção (inclui
  #                   POSTGRES_PASSWORD e ANTHROPIC_API_KEY)
  # Variables do environment `production`:
  #   PRODUCTION_URL (ex.: https://recrutamento.empresa.com)
  #   PROD_APP_DIR   (opcional, padrão /opt/ia-recruitment)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy (production)
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ vars.PROD_APP_DIR || '/opt/ia-recruitment' }}
    steps:
      - name: Verificar configuração do ambiente
        id: preflight
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          KEY: ${{ secrets.PROD_SSH_KEY }}
          ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ] || [ -z "$ENV_FILE" ]; then
            echo "::warning::Secrets de produção não configurados — deploy não executado."
            {
              echo "### ⚠️ Deploy de produção não executado"
              echo "Configure os secrets \`PROD_SSH_HOST\`, \`PROD_SSH_USER\`, \`PROD_SSH_KEY\` e \`PROD_ENV_FILE\`"
              echo "no environment **production** (Settings ▸ Environments)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.preflight.outputs.enabled == 'true'

      - name: Montar pacote de deploy
        if: steps.preflight.outputs.enabled == 'true'
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          mkdir -p deploy
          cp docker-compose.yml docker-compose.prod.yml Caddyfile deploy/
          printf '%s\n' "$PROD_ENV_FILE" > deploy/.env
          sed -i '/^IMAGE_API=/d' deploy/.env
          echo "IMAGE_API=${IMAGE_API}:${GITHUB_SHA}" >> deploy/.env
          chmod 600 deploy/.env

      - name: Copiar arquivos para o servidor
        if: steps.preflight.outputs.enabled == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: deploy
          target: ${{ env.APP_DIR }}/.incoming
          strip_components: 1
          overwrite: true

      - name: Deploy
        id: deploy
        if: steps.preflight.outputs.enabled == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ env.APP_DIR }}
          COMPOSE: ${{ env.COMPOSE }}
          APP_SERVICES: ${{ env.APP_SERVICES }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,APP_DIR,COMPOSE,APP_SERVICES
          script: |
            set -eu
            cd "$APP_DIR"
            # Guarda a versão atual para rollback
            [ -f .env ] && cp .env .env.previous
            mv .incoming/.env .env && chmod 600 .env
            mv -f .incoming/docker-compose.yml .incoming/docker-compose.prod.yml .incoming/Caddyfile .
            rmdir .incoming 2>/dev/null || true

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            $COMPOSE pull $APP_SERVICES
            $COMPOSE run --rm migrate
            $COMPOSE up -d --no-build --remove-orphans $APP_SERVICES
            docker logout ghcr.io
            docker image prune -f

      - name: Health check de produção
        if: steps.preflight.outputs.enabled == 'true'
        env:
          URL: ${{ vars.PRODUCTION_URL }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$URL/health" && exit 0
            sleep 5
          done
          echo "::error::Produção não respondeu em $URL/health"
          exit 1

      - name: Rollback automático
        if: failure() && steps.deploy.outcome != 'skipped' && steps.preflight.outputs.enabled == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP_DIR: ${{ env.APP_DIR }}
          COMPOSE: ${{ env.COMPOSE }}
          APP_SERVICES: ${{ env.APP_SERVICES }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: APP_DIR,COMPOSE,APP_SERVICES
          script: |
            set -eu
            cd "$APP_DIR"
            if [ -f .env.previous ]; then
              mv .env.previous .env
              $COMPOSE up -d --no-build $APP_SERVICES
              echo "Rollback para a versão anterior concluído."
            else
              echo "Sem versão anterior para rollback (primeiro deploy)."
            fi
